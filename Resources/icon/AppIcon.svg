<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1C1E"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.6" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <!-- macOS squircle tile (824px on the 1024 grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#dots)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g clip-path="url(#tile)">
  <!-- Pebble, default (idle) state, from Mascot/PebbleShape.swift -->
  <g transform="translate(512 525) scale(7.4) translate(-50 -51.5)" filter="url(#shadow)">
    <path d="M50,19 C67,19 81,31 81.5,47 C82,63 75.5,77 62,82 C49,86.5 33,84 24.5,75 C16.5,66.5 16.5,53 18,43 C20,29 33,19 50,19 Z"
          fill="#232326" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1.9" stroke-linejoin="round"/>
    <ellipse cx="42" cy="47" rx="6.2" ry="7.4" fill="#F6F1E7"/>
    <ellipse cx="60" cy="47" rx="6.2" ry="7.4" fill="#F6F1E7"/>
  </g>
  </g>
</svg>
